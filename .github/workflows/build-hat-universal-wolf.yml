      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build H.A.T. Universal Wolf APK
        working-directory: HAT_Universal_Wolf_Project
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find HAT_Universal_Wolf_Project/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" HAT-Universal-Wolf.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAT-Universal-Wolf-APK
          path: HAT-Universal-Wolf.apk
