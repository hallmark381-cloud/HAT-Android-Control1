name: Build HAT Local Only APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-hat-local-only.yml"
      - ".github/workflows/hat-local-only.b64"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create H.A.T. local-only project
        run: |
          base64 -d .github/workflows/hat-local-only.b64 > HAT_Local_Only_Project.zip
          unzip -q HAT_Local_Only_Project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build H.A.T. Local Only APK
        working-directory: HAT_Local_Only_Project
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find HAT_Local_Only_Project/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" HAT-Local-Only.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAT-Local-Only-APK
          path: HAT-Local-Only.apk
