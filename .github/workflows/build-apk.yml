name: Build HAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - "HAT_Project.part1"
      - "HAT_Project.part2"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Join project parts
        run: cat HAT_Project.part1 HAT_Project.part2 > HAT_Project.zip

      - name: Extract H.A.T. project
        run: |
          mkdir hat-build
          unzip -q HAT_Project.zip -d hat-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build H.A.T. APK
        working-directory: hat-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find hat-build/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" HAT-Control.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAT-Control-APK
          path: HAT-Control.apk
