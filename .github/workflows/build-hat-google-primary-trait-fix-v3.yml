name: Build HAT Google Primary-Trait Fix V3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "HAT_Project.part1"
      - "HAT_Project.part2"
      - ".github/workflows/build-hat-google-primary-trait-fix-v3.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Join project parts
        run: cat HAT_Project.part1 HAT_Project.part2 > HAT_Project.zip

      - name: Extract H.A.T. project
        run: |
          mkdir hat-build
          unzip -q HAT_Project.zip -d hat-build

      - name: Apply H.A.T. color and sound upgrade
        run: |
          mkdir -p "$(dirname 'hat-build/app/src/main/java/com/hat/control/ui/HatRealControlApp.kt')"
          printf '%s' '' | base64 -d > 'hat-build/app/src/main/java/com/hat/control/ui/HatRealControlApp.kt'

          mkdir -p "$(dirname 'hat-build/app/src/main/java/com/hat/control/integration/GoogleHomeBridgeImpl.kt')"
          printf '%s' '' | base64 -d > 'hat-build/app/src/main/java/com/hat/control/integration/GoogleHomeBridgeImpl.kt'

          mkdir -p "$(dirname 'hat-build/app/src/main/java/com/hat/control/HatController.kt')"
          printf '%s' '' | base64 -d > 'hat-build/app/src/main/java/com/hat/control/HatController.kt'

          mkdir -p "$(dirname 'hat-build/app/src/main/java/com/hat/control/SoundReactiveEngine.kt')"
          printf '%s' '' | base64 -d > 'hat-build/app/src/main/java/com/hat/control/SoundReactiveEngine.kt'

          mkdir -p "$(dirname 'hat-build/app/src/main/AndroidManifest.xml')"
          printf '%s' '' | base64 -d > 'hat-build/app/src/main/AndroidManifest.xml'

          mkdir -p "$(dirname 'hat-build/app/build.gradle.kts')"
          printf '%s' '' | base64 -d > 'hat-build/app/build.gradle.kts'

      - name: Fix Google Home command routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("hat-build/app/src/main/java/com/hat/control/integration/GoogleHomeBridgeImpl.kt")
          s = p.read_text()
          s = s.replace(
              "it.devices(enableMultipartDevices = true).list()",
              "it.devices(enableMultipartDevices = false).list()"
          )
          p.write_text(s)
          PY

      - name: Fix Google Home power command target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("hat-build/app/src/main/java/com/hat/control/integration/GoogleHomeBridgeImpl.kt")
          s = p.read_text()

          if "import kotlinx.coroutines.flow.first" not in s:
              lines = s.splitlines()
              last_import = max(i for i, line in enumerate(lines) if line.startswith("import "))
              lines.insert(last_import + 1, "import kotlinx.coroutines.flow.first")
              s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")

          marker = "override suspend fun setPower("
          start = s.find(marker)
          if start < 0:
              raise SystemExit("setPower function not found")

          brace = s.find("{", start)
          if brace < 0:
              raise SystemExit("setPower opening brace not found")

          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("setPower closing brace not found")

          replacement = '''override suspend fun setPower(id: String, on: Boolean) {
              var handle = handles[id]
              if (handle == null) {
                  refresh()
                  handle = handles[id]
              }
              if (handle == null) {
                  _status.value = "Google Home device not found"
                  return
              }

              try {
                  val typeSet = handle.device.types().first()
                  val primaryType = typeSet.firstOrNull { it.metadata.isPrimaryType }
                      ?: typeSet.singleOrNull()

                  val primaryOnOff = primaryType
                      ?.traits()
                      ?.filterIsInstance<OnOff>()
                      ?.firstOrNull()

                  val fallbackOnOff = if (primaryOnOff == null) {
                      typeSet.asSequence()
                          .flatMap { it.traits().asSequence() }
                          .filterIsInstance<OnOff>()
                          .firstOrNull()
                  } else {
                      null
                  }

                  val onOffTrait = primaryOnOff ?: fallbackOnOff
                  if (onOffTrait == null) {
                      _status.value = "This Google Home device has no on/off control"
                      return
                  }

                  if (on) onOffTrait.on() else onOffTrait.off()
                  _status.value = "Google Home light command sent"
                  refresh()
              } catch (e: HomeException) {
                  _status.value = "Google Home command failed (${e.code}): ${e.message ?: "Unknown error"}"
              } catch (e: Exception) {
                  _status.value = "Google Home command error: ${e.message ?: e::class.java.simpleName}"
              }
          }'''

          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          print("Replaced setPower with primary-device OnOff trait routing")
          PY

      - name: Remove unsupported HomeException code field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("hat-build/app/src/main/java/com/hat/control/integration/GoogleHomeBridgeImpl.kt")
          s = p.read_text()
          s = s.replace(
              'Google Home command failed (${e.code}): ${e.message ?: "Unknown error"}',
              'Google Home command failed: ${e.message ?: "Unknown error"}'
          )
          if "e.code" in s:
              raise SystemExit("Unsupported HomeException e.code reference still present")
          p.write_text(s)
          print("Removed unsupported HomeException.code reference")
          PY

      - name: Add automatic smart-device detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("hat-build/app/src/main/java/com/hat/control/ui/HatRealControlApp.kt")
          s = p.read_text()
          old = "LaunchedEffect(Unit) { controller.smartHome.refresh() }"
          new = '''LaunchedEffect(Unit) {
              while (true) {
                  controller.smartHome.refresh()
                  delay(10_000)
              }
          }'''
          if old not in s:
              raise SystemExit("Auto-detect patch target not found")
          s = s.replace(old, new, 1)
          s = s.replace('Text("Refresh devices")', 'Text("Detect devices now")')
          p.write_text(s)
          PY

      - name: Bump H.A.T. Google-restored version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("hat-build/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("versionCode = 7", "versionCode = 29")
          s = s.replace('versionName = "2.2.0-color-sound"', 'versionName = "3.5.3-google-primary-trait-fix-v3"')
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build H.A.T. APK
        working-directory: hat-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find hat-build/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" HAT-Control-Google-Primary-Trait-Fix-V3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAT-Control-Google-Primary-Trait-Fix-V3-APK
          path: HAT-Control-Google-Primary-Trait-Fix-V3.apk
